name: Godot 4.7.2 smoke tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  godot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        run: |
          curl -fL --retry 3 --connect-timeout 25 \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64

      - name: Import scenes and assets
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import

      - name: Run content and combat smoke tests
        run: timeout 90s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/smoke_test.gd
